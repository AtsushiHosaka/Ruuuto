<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruuuto ログイン・アカウント作成</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --ink:#0d1a33; --accent:#6e9bf2; --line:#bed2f9; --soft:#283e68;
    --sub:#515a6c; --page:#f3f7fe;
    --display:ui-rounded,"Arial Rounded MT Bold","Hiragino Maru Gothic ProN",sans-serif;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:#e7eaf0;
    color:var(--ink);
  }
  * { box-sizing:border-box }
  body { margin:0 }
  button,input { font:inherit }
  button { cursor:pointer }
  button:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:4px }
  [hidden] { display:none !important }
  main { width:min(100%,944px); margin:auto; padding:24px 24px 32px }
  .review-bar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 20px; margin-bottom:18px }
  .review-bar h1 { margin:0; font:800 clamp(20px,4vw,29px)/1.25 var(--display) }
  .languages { display:flex; gap:12px }
  .languages button { min-height:44px; padding:5px 2px; background:none; border:0; border-bottom:2px solid transparent; color:var(--sub); font-size:14px; font-weight:700 }
  .languages button[aria-pressed="true"] { border-color:var(--ink); color:var(--ink) }
  .screens { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px }
  figure { margin:0; min-width:0 }
  figcaption { margin:0 0 8px; color:var(--sub); font-size:13px; font-weight:700 }
  .screen {
    color-scheme:dark; color:white; display:flex; flex-direction:column; min-height:610px;
    padding:30px 29px 32px; background-color:var(--ink);
    background-image:radial-gradient(var(--soft) 1px,transparent 1px); background-size:18px 18px;
  }
  .brand { position:relative; min-height:168px; display:flex; align-items:flex-end; margin-bottom:22px }
  .wordmark { position:relative; margin:0; font:800 clamp(47px,7vw,56px)/1.04 var(--display); letter-spacing:-.04em }
  .memories { position:absolute; top:3px; right:4px; width:164px; height:106px; pointer-events:none }
  .photo { position:absolute; width:76px; height:85px; border-radius:5px; background:#fff; padding:5px 5px 15px; box-shadow:0 8px 14px #04091495 }
  .photo:first-child { left:9px; top:12px; transform:rotate(-12deg) }
  .photo:nth-child(2) { left:83px; top:2px; transform:rotate(11deg) }
  .photo svg { width:100%; height:100%; display:block; border-radius:2px }
  .spark { position:absolute; top:0; left:77px; color:var(--accent); font-size:18px; line-height:1 }
  .mode-tabs { display:flex; gap:18px; margin-bottom:21px; border-bottom:1px solid #50658a }
  .mode-tabs button {
    min-height:44px; text-align:left; padding:0 2px; background:transparent; border:0;
    border-bottom:2px solid transparent; color:var(--line); font-size:15px; font-weight:650;
  }
  .mode-tabs button[aria-pressed="true"] { border-color:var(--accent); color:white; font-weight:800 }
  .field { display:block; margin-top:17px; color:var(--line); font-size:13px; font-weight:700 }
  .field input {
    display:block; width:100%; min-height:48px; margin-top:2px; padding:7px 0;
    border:0; border-bottom:1px solid #61789e; border-radius:0; background:transparent; color:white; font-size:16px;
  }
  .field input:focus { border-bottom-color:var(--accent) }
  .field input::placeholder { color:#a5b8da }
  .primary {
    width:100%; min-height:49px; margin-top:26px; border:0; border-radius:10px;
    background:var(--accent); color:var(--ink); font-weight:800; font-size:16px;
  }
  .primary:disabled { cursor:default; background:var(--soft); color:#d4e0f6 }
  .feedback { color:var(--line); font-size:13px; margin:12px 0 0 }
  @media (max-width:625px) {
    main { width:min(100%,430px); padding:14px 13px 24px }
    .screens { grid-template-columns:1fr; gap:20px }
    .screen { min-height:568px; padding:22px 22px 27px }
    .brand { min-height:148px }
  }
</style>
</head>
<body>
<main>
  <header class="review-bar">
    <h1 data-copy="reviewTitle">Ruuuto 認証画面案</h1>
    <div class="languages" role="group" aria-label="モックの表示言語" data-group-copy="language">
      <button type="button" lang="ja" data-lang="ja" aria-pressed="true">日本語</button>
      <button type="button" lang="en" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>
  <div class="screens">
    <figure><figcaption data-caption></figcaption><section class="screen" data-screen="signIn"></section></figure>
    <figure><figcaption data-caption></figcaption><section class="screen" data-screen="signUp"></section></figure>
  </div>
</main>

<template id="auth">
  <div class="brand">
    <div class="memories" aria-hidden="true">
      <span class="photo"><svg viewBox="0 0 90 90"><path fill="#8EA8D2" d="M0 0h90v90H0z"/><circle cx="63" cy="31" r="12" fill="#E9F0FF"/><path fill="#4C648E" d="M0 66l22-22 10 9 15-22 43 33v26H0z"/><path fill="#B3C8EA" d="M0 72q23-9 39-1t51 1v18H0z"/></svg></span>
      <span class="photo"><svg viewBox="0 0 90 90"><path fill="#B7CAEA" d="M0 0h90v90H0z"/><path fill="#7691BD" d="M0 58h13V41h14v20h15V30h20v30h13V47h15v43H0z"/><path fill="#426096" d="M0 69h15v-9h19v13h13V52h21v21h22v17H0z"/><path d="M50 61h14M50 66h14" stroke="#CADAF4" stroke-width="2" stroke-dasharray="2 3"/></svg></span>
      <span class="spark">✦</span>
    </div>
    <h2 class="wordmark">Ruuuto</h2>
  </div>

  <form>
    <div class="mode-tabs" role="group" data-group-copy="mode">
      <button type="button" data-mode="signIn" data-copy="signIn">ログイン</button>
      <button type="button" data-mode="signUp" data-copy="signUp">アカウントを作成</button>
    </div>
    <label class="field">
      <span data-copy="email">メールアドレス</span>
      <input name="email" type="email" placeholder="name@example.com" autocapitalize="none" autocomplete="off" required>
    </label>
    <label class="field">
      <span data-copy="password">パスワード</span>
      <input name="password" type="password" autocomplete="off" required>
    </label>
    <button class="primary" type="submit" disabled></button>
    <p class="feedback" role="status" hidden></p>
  </form>
</template>

<script>
  const copy = {
    ja: { reviewTitle:"Ruuuto 認証画面案", language:"モックの表示言語", mode:"手続き",
      signIn:"ログイン", signUp:"アカウントを作成", email:"メールアドレス",
      password:"パスワード", passwordPrompt:"パスワードを入力", demo:"モックのため、入力内容は送信されません。" },
    en: { reviewTitle:"Ruuuto sign-in mockup", language:"Mockup language", mode:"Account action",
      signIn:"Sign in", signUp:"Create account", email:"Email address",
      password:"Password", passwordPrompt:"Enter your password", demo:"This mockup does not send your entries." }
  };
  const params = new URLSearchParams(location.search);
  let language = params.get("lang") === "en" ? "en" : "ja";
  const languageButtons = [...document.querySelectorAll("[data-lang]")];
  const views = [...document.querySelectorAll("[data-screen]")].map((screen) => {
    screen.append(document.querySelector("#auth").content.cloneNode(true));
    const form = screen.querySelector("form");
    const submit = form.querySelector(".primary");
    const feedback = form.querySelector(".feedback");
    const caption = screen.previousElementSibling;
    let mode = screen.dataset.screen;

    if (params.get("sample") === "1") {
      form.elements.email.value = "name@example.com";
      form.elements.password.value = "preview-only";
    }

    const refresh = () => {
      const labels = copy[language];
      form.querySelectorAll("[data-mode]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
      });
      caption.textContent = labels[mode];
      screen.setAttribute("aria-label", labels[mode]);
      form.elements.password.placeholder = labels.passwordPrompt;
      submit.textContent = labels[mode];
      submit.disabled = !form.checkValidity();
      if (!feedback.hidden) feedback.textContent = labels.demo;
    };

    form.querySelectorAll("[data-mode]").forEach((button) => button.addEventListener("click", () => {
      mode = button.dataset.mode;
      feedback.hidden = true;
      refresh();
    }));
    form.addEventListener("input", () => {
      feedback.hidden = true;
      refresh();
    });
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      feedback.textContent = copy[language].demo;
      feedback.hidden = false;
    });
    return refresh;
  });

  function showLanguage() {
    document.documentElement.lang = language;
    document.querySelectorAll("[data-copy]").forEach((node) => { node.textContent = copy[language][node.dataset.copy]; });
    document.querySelectorAll("[data-group-copy]").forEach((node) => {
      node.setAttribute("aria-label", copy[language][node.dataset.groupCopy]);
    });
    languageButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.lang === language)));
    views.forEach((refresh) => refresh());
  }

  languageButtons.forEach((button) => button.addEventListener("click", () => {
    language = button.dataset.lang;
    showLanguage();
  }));
  showLanguage();
</script>
</body>
</html>
