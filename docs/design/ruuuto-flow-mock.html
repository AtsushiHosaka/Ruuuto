<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruuuto 追加画面のモック</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #6e9bf2;
    --ink: #0d1a33;
    --page: #f3f7fe;
    --line: #bed2f9;
    --sub: #515a6c;
    --soft: #283e68;
    --pale: #e5edfd;
    --photo-blue: #bad0fa;
    --photo-sky: #a8c3f7;
    --heading: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
    --body: "Noto Sans JP", "Hiragino Sans", sans-serif;
    --hand: "Yusei Magic", "Hiragino Maru Gothic ProN", sans-serif;
    color: var(--ink);
    background: #e7eaf0;
    font-family: var(--body);
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  button, input, textarea { font: inherit; }
  button { color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  [hidden] { display: none !important; }
  .icons { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }

  .review { max-width: 862px; margin: auto; padding: 28px 20px 36px; }
  .review-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .review-header h1 { margin: 0; font: 800 clamp(22px, 5vw, 28px)/1.3 var(--heading); }
  .reference { color: var(--sub); text-underline-offset: 4px; font-size: 13px; }
  .review-tabs { display: flex; align-items: center; flex-wrap: wrap; gap: 0 14px; margin: 15px 0 18px; border-bottom: 1px solid #c3cddd; }
  .review-tabs button { min-height: 43px; padding: 4px 2px; color: var(--sub); background: none; border: 0; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 700; }
  .review-tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }

  .screens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .screens.is-single { grid-template-columns: minmax(0, 390px); justify-content: center; }
  .screen {
    min-height: 484px;
    background: var(--page);
    border: 1px solid #cbd6e7;
    --foreground: var(--ink);
    --secondary: var(--sub);
    --rule: #acbfdd;
    color: var(--foreground);
  }
  .screen.dark {
    --foreground: #fff;
    --secondary: var(--line);
    --rule: #6178a3;
    border-color: var(--ink);
    background-color: var(--ink);
    background-image: radial-gradient(#263c62 .9px, transparent 1px);
    background-size: 18px 18px;
  }
  .topbar {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr) 48px;
    align-items: center;
    padding: 26px 14px 12px;
  }
  .topbar h2 { margin: 0; text-align: center; font: 800 20px/1.4 var(--heading); }
  .topbar-button, .topbar a {
    min-height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    text-decoration: none;
    border: 0;
    background: none;
    color: var(--foreground);
  }
  .topbar-button { font: 800 15px var(--heading); color: #345b9d; }
  .topbar-button[data-back] { color: var(--foreground); }
  .topbar-button:disabled { color: var(--secondary); opacity: .65; cursor: default; }
  .dark .topbar-button:not(:disabled) { color: var(--line); }
  .content { padding: 20px 20px 30px; }
  .form-label { display: block; font: 700 13px/1.5 var(--heading); color: var(--secondary); }
  .field {
    width: 100%;
    min-height: 46px;
    margin-top: 3px;
    padding: 9px 0 10px;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--foreground);
  }
  .field::placeholder { color: var(--secondary); opacity: .8; }
  textarea.field { min-height: 98px; resize: none; }
  .row {
    min-height: 64px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .row-label { flex: 1; min-width: 0; font: 800 17px/1.55 var(--heading); overflow-wrap: anywhere; }
  .group-tile {
    width: 60px;
    height: 60px;
    position: relative;
    overflow: hidden;
    background: var(--ink);
    border-radius: 16px;
    flex: none;
  }
  .mini-photo {
    position: absolute;
    display: block;
    width: 24px;
    height: 28px;
    left: 8px;
    top: 10px;
    padding: 2px 2px 6px;
    border-radius: 2px;
    background: #fff;
    transform: rotate(-8deg);
  }
  .mini-photo::after { content: ""; display: block; height: 100%; background: var(--photo-blue); }
  .mini-photo + .mini-photo { left: 28px; top: 20px; transform: rotate(6deg); }
  .mini-photo + .mini-photo::after { background: var(--photo-sky); }
  .avatars { display: flex; align-items: center; padding: 0; margin: 4px 0 0; list-style: none; }
  .avatars > * { display: grid; place-items: center; width: 24px; height: 24px; margin-left: -5px; border: 2px solid var(--page); border-radius: 50%; background: var(--pale); color: var(--ink); font: 700 10px var(--body); }
  .avatars > :first-child { margin-left: 0; }
  .group-form .field { min-height: 58px; font: 800 24px/1.25 var(--heading); }
  .group-form .field::placeholder { font-size: 20px; font-weight: 500; }
  .group-preview { margin: 28px 0 0; padding: 12px 0; border-top: 1px dashed var(--line); }
  .group-preview > figcaption { margin-bottom: 10px; font: 700 12px var(--heading); color: var(--sub); }
  .group-preview[data-filled="false"] .row-title { color: var(--sub); font-weight: 500; }
  .board-context { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; margin: 0 0 24px; padding-bottom: 11px; border-bottom: 1px solid var(--soft); }
  .board-context strong { font: 800 15px var(--heading); }
  .board-context time { display: flex; align-items: center; gap: 5px; color: var(--line); font-size: 13px; }
  .board-context .icon { width: 16px; height: 16px; }
  .topic-field { margin-top: 7px; min-height: 104px; font: 800 28px/1.45 var(--heading); }
  .topic-field:focus-visible { outline: 0; border-bottom: 2px solid var(--accent); }
  .invite-content { padding-top: 12px; }
  .invite-postcards { position: relative; height: 158px; width: min(220px, 90%); margin: 0 auto 12px; }
  .postcard { display: block; position: absolute; width: 107px; height: 122px; padding: 5px 5px 6px; left: 17px; top: 13px; margin: 0; background: #fff; border-radius: 6px; box-shadow: 0 6px 12px #1023412a; transform: rotate(-10deg); }
  .postcard + .postcard { left: auto; right: 13px; top: 23px; transform: rotate(9deg); }
  .postcard .snapshot { height: 93px; border-radius: 3px; background: linear-gradient(152deg, #637da8 12%, #b0b9d8 57%, #768dad 58% 68%, #abc0e1 69%); }
  .postcard + .postcard .snapshot { background: linear-gradient(152deg, #c4d5f4 10%, #809ebd 53%, #eadfee 54% 62%, #8da6bc 63%); }
  .postcard figcaption { margin: 3px 1px 0; font: 400 10px/1.3 var(--hand); }
  .invite-name { margin: 0; text-align: center; font: 800 24px/1.35 var(--heading); }
  .invite-content .avatars { justify-content: center; margin-top: 8px; }
  .invite-content .primary { margin-top: 23px; }
  .notification-row { border-block: 1px solid var(--line); padding-block: 10px; }
  .notification-row .icon { color: #345b9d; }
  .row-caption { display: block; margin-top: 2px; color: var(--secondary); font: 400 13px var(--body); }
  .notice-preview { margin: 28px 0 0; }
  .notice-preview dt { color: var(--sub); font: 700 12px var(--heading); }
  .notice-preview dd { margin: 8px 0 0; padding: 3px 0 3px 11px; border-left: 2px solid var(--accent); }
  .notice-preview strong { font: 800 16px var(--heading); }
  .primary {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 48px;
    margin-top: 22px;
    padding: 8px 12px;
    background: var(--accent);
    color: var(--ink);
    border: 0;
    border-radius: 8px;
    font: 800 16px var(--heading);
  }
  .settings-action { min-height: 44px; padding: 0 0 0 8px; background: none; border: 0; font: 800 15px var(--heading); }
  .feedback { margin: 18px 0 0; color: var(--secondary); font-size: 13px; }

  @media (max-width: 630px) {
    .review { max-width: 429px; padding: 20px 14px 28px; }
    .screens { grid-template-columns: minmax(0, 1fr); }
    .review-tabs { column-gap: 10px; }
  }
</style>
</head>
<body>
<svg class="icons" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2 2 0 0 0 4 0"/></symbol>
</svg>

<main class="review">
  <header class="review-header">
    <h1>Ruuuto 追加画面</h1>
    <a class="reference" href="eesu-ui-design.html">元のHTML案</a>
  </header>
  <nav class="review-tabs" aria-label="表示する案">
    <button type="button" data-show="all" aria-pressed="true">一覧</button>
    <button type="button" data-show="group" aria-pressed="false">グループ作成</button>
    <button type="button" data-show="invite" aria-pressed="false">招待</button>
    <button type="button" data-show="topic" aria-pressed="false">お題編集</button>
    <button type="button" data-show="notifications" aria-pressed="false">通知設定</button>
  </nav>
  <div class="screens">
    <section class="screen" data-screen="group" aria-labelledby="group-title">
      <header class="topbar">
        <button type="button" class="topbar-button" data-back aria-label="戻る"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        <h2 id="group-title">グループ作成</h2>
        <button type="submit" class="topbar-button" id="create" form="group-form" disabled>作成</button>
      </header>
      <form class="content group-form" id="group-form">
        <label class="form-label" for="group-name">グループ名</label>
        <input class="field" id="group-name" name="group" type="text" placeholder="新しいグループ" autocomplete="off" required>
        <figure class="group-preview" data-filled="false">
          <figcaption>一覧での表示</figcaption>
          <div class="row">
            <span class="group-tile" aria-hidden="true"><i class="mini-photo"></i><i class="mini-photo"></i></span>
            <span class="row-label"><span class="row-title" id="group-preview-name">新しいグループ</span><span class="avatars" aria-label="作成者1人"><span>R</span></span></span>
          </div>
        </figure>
        <p class="feedback" role="status" hidden></p>
      </form>
    </section>

    <section class="screen" data-screen="invite" aria-labelledby="invite-title">
      <header class="topbar">
        <button type="button" class="topbar-button" data-back aria-label="戻る"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        <h2 id="invite-title">招待</h2>
        <span></span>
      </header>
      <div class="content invite-content">
        <div class="invite-postcards" aria-hidden="true">
          <figure class="postcard"><div class="snapshot"></div><figcaption>A・東京</figcaption></figure>
          <figure class="postcard"><div class="snapshot"></div><figcaption>S・Vancouver</figcaption></figure>
        </div>
        <h3 class="invite-name">えーえす班</h3>
        <ul class="avatars" aria-label="メンバー5人"><li>A</li><li>K</li><li>M</li><li>R</li><li>S</li></ul>
        <button type="button" class="primary" id="join">
          グループに参加
          <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg>
        </button>
        <p class="feedback" role="status" hidden></p>
      </div>
    </section>

    <section class="screen dark" data-screen="topic" aria-labelledby="topic-title">
      <header class="topbar">
        <button type="button" class="topbar-button" data-back aria-label="戻る"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        <h2 id="topic-title">お題を変更</h2>
        <button type="submit" class="topbar-button" id="save" form="topic-form" disabled>保存</button>
      </header>
      <form class="content" id="topic-form">
        <div class="board-context">
          <strong>えーえす班</strong>
          <time datetime="2026-12-25" aria-label="締切12月25日"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>12.25</time>
        </div>
        <label class="form-label" for="topic-value">お題</label>
        <textarea class="field topic-field" id="topic-value" name="topic" rows="2" required>窓の外</textarea>
        <p class="feedback" role="status" hidden></p>
      </form>
    </section>

    <section class="screen" data-screen="notifications" aria-labelledby="notification-title">
      <header class="topbar">
        <button type="button" class="topbar-button" data-back aria-label="戻る"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        <h2 id="notification-title">通知設定</h2>
        <span></span>
      </header>
      <div class="content">
        <div class="row notification-row">
          <svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>
          <span class="row-label">お題の更新<span class="row-caption" id="notification-status">オフ</span></span>
          <button type="button" class="settings-action" id="permission">通知を許可</button>
        </div>
        <dl class="notice-preview">
          <dt>通知例</dt>
          <dd><strong>お題が変わりました</strong><span class="row-caption">えーえす班 · 窓の外</span></dd>
        </dl>
        <p class="feedback" role="status" hidden></p>
      </div>
    </section>
  </div>
</main>

<script>
  const displays = Array.from(document.querySelectorAll("[data-screen]"));
  const tabs = Array.from(document.querySelectorAll("[data-show]"));
  function show(screen) {
    document.querySelector(".screens").classList.toggle("is-single", screen !== "all");
    for (const panel of displays) panel.hidden = screen !== "all" && panel.dataset.screen !== screen;
    for (const tab of tabs) tab.setAttribute("aria-pressed", String(tab.dataset.show === screen));
  }
  function showMessage(container, message) {
    const output = container.querySelector(".feedback");
    output.textContent = message;
    output.hidden = false;
  }
  for (const tab of tabs) tab.addEventListener("click", () => show(tab.dataset.show));
  for (const back of document.querySelectorAll("[data-back]")) back.addEventListener("click", () => show("all"));

  const groupForm = document.querySelector("#group-form");
  const groupName = document.querySelector("#group-name");
  const create = document.querySelector("#create");
  groupName.addEventListener("input", () => {
    const name = groupName.value.trim();
    create.disabled = !name;
    document.querySelector("#group-preview-name").textContent = name || "新しいグループ";
    document.querySelector(".group-preview").dataset.filled = String(Boolean(name));
  });
  groupForm.addEventListener("submit", (event) => {
    event.preventDefault();
    if (groupName.value.trim()) showMessage(groupForm, "作成しました（モック）");
  });

  const topicForm = document.querySelector("#topic-form");
  const topic = document.querySelector("#topic-value");
  const save = document.querySelector("#save");
  let savedTopic = topic.value;
  topic.addEventListener("input", () => { save.disabled = !topic.value.trim() || topic.value.trim() === savedTopic; });
  topicForm.addEventListener("submit", (event) => {
    event.preventDefault();
    if (!topic.value.trim() || topic.value.trim() === savedTopic) return;
    savedTopic = topic.value.trim();
    save.disabled = true;
    showMessage(topicForm, "保存しました（モック）");
  });

  document.querySelector("#join").addEventListener("click", ({ currentTarget }) => {
    currentTarget.disabled = true;
    showMessage(currentTarget.parentElement, "参加しました（モック）");
  });
  document.querySelector("#permission").addEventListener("click", ({ currentTarget }) => {
    if (currentTarget.dataset.allowed) {
      showMessage(currentTarget.closest(".content"), "iPhoneの設定へ進みます（モック）");
      return;
    }
    currentTarget.dataset.allowed = "true";
    currentTarget.textContent = "設定を開く";
    document.querySelector("#notification-status").textContent = "オン（モック）";
  });
</script>
</body>
</html>
