<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>えーえす班 UI案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root{
  --main:#6E9BF2; --dark:#0D1A33; --on:#0D1A33;
  --light:color-mix(in srgb,var(--main) 18%,#fff);
  --soft:color-mix(in srgb,var(--main) 28%,var(--dark));
  --land:color-mix(in srgb,var(--main) 20%,var(--dark));
  --grid:color-mix(in srgb,var(--main) 14%,var(--dark));
  --muted:color-mix(in srgb,var(--main) 45%,#fff);
  --p1:color-mix(in srgb,var(--main) 60%,#fff);
  --p2:color-mix(in srgb,var(--main) 38%,#fff);
  --p3:color-mix(in srgb,var(--main) 80%,#fff);
  --page:color-mix(in srgb,var(--main) 8%,#fff);
  --line:color-mix(in srgb,var(--main) 45%,#fff);
  --sub:color-mix(in srgb,var(--dark) 72%,#fff);
  --faint:color-mix(in srgb,var(--dark) 30%,#fff);
}
*{box-sizing:border-box}
body{margin:0;background:#E7EAF0;font-family:'Noto Sans JP',sans-serif;color:#12141A}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{max-width:2200px;margin:0 auto;padding:32px 40px 8px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-family:'M PLUS Rounded 1c',sans-serif;font-size:26px}
.top p{margin:4px 0 0;color:#4A5160;font-size:14px}
.top label{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
.top select{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid #C4CAD6;background:#fff}
.screens{max-width:2200px;margin:0 auto;padding:24px 40px 60px;display:flex;flex-wrap:wrap;gap:40px;justify-content:center}
.shot{display:flex;flex-direction:column;gap:12px;align-items:center}
.shot h2{margin:0;font-size:15px;font-weight:700;color:#2A303C}
.phone{width:390px;height:844px;position:relative;overflow:hidden;border-radius:44px;box-shadow:0 20px 50px rgba(0,0,0,.18);flex-shrink:0}
@media (max-width:440px){.screens{padding:16px}.phone{transform:scale(.85);transform-origin:top center;margin-bottom:-127px}}
.dark{background:var(--dark);color:#fff}
.light{background:var(--page);color:var(--dark)}
.rounded{font-family:'M PLUS Rounded 1c',sans-serif}
.hand{font-family:'Yusei Magic',sans-serif}
.ib{width:44px;height:44px;border:none;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;padding:0}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px}
.dark nav{background:var(--dark);border-top:1px solid var(--soft)}
.light nav{background:var(--page);border-top:1px solid var(--line)}
nav a{width:56px;height:44px;display:flex;align-items:center;justify-content:center}
.dark nav a{color:var(--muted)} .light nav a{color:var(--sub)}
nav a.on{color:var(--main)} .light nav a.on{color:var(--dark)}
nav a.cam{width:64px;height:64px;margin-top:-26px;border-radius:50%;background:var(--main);color:var(--on)!important;border:4px solid var(--dark)}
.light nav a.cam{border-color:var(--page)}
.switch{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;font-weight:700;font-size:15px}
.av{width:32px;height:32px;border-radius:50%;background:var(--light);border:2px solid var(--dark);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dark)}
.av+.av{margin-left:-8px}
.pol{position:absolute;margin:0;padding:7px 7px 26px;background:#fff;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.pol div{border-radius:3px}
.pol figcaption{position:absolute;left:10px;bottom:4px;font-size:13px;color:var(--dark)}
.flake{position:absolute;top:0;background:#fff;pointer-events:none}
.cursor{position:absolute;pointer-events:none}
.cursor span{display:inline-block;margin:-4px 0 0 14px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}
@keyframes fall{0%{transform:translate(0,-20px)}50%{transform:translate(14px,420px)}100%{transform:translate(-6px,870px)}}
@keyframes cursorK{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,18px)}}
@keyframes cursorS{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-14px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
.tile{position:relative;display:block;height:96px;border-radius:16px;overflow:hidden}
.mini{position:absolute;background:#fff;border-radius:2px;padding:2px 2px 7px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mini span{display:block;height:100%;border-radius:1px}
.pin{position:absolute;width:76px;height:92px;border:none;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center}
.pin .ring{position:relative;display:block;border-radius:50%;padding:3px;background:#fff}
.pin .ring span{display:block;width:100%;height:100%;border-radius:50%}
.pin .tail{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #fff;margin-top:-2px}
.pin .cnt{position:absolute;right:6px;top:-2px;min-width:22px;height:22px;border-radius:11px;background:var(--main);color:var(--on);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="top">
<div>
<h1>えーえす班 — 海外の友達と季節ごとにボードをつくる</h1>
<p>iPhone UI案。毎月テーマカラーが1色決まり、その月はその色だけで画面をつくります。ステッカーとマップのピンは押せます。</p>
</div>
<label>表示する月
<select id="month">
<option value="1">1月 新年・朱</option><option value="2">2月 バレンタイン・ローズ</option><option value="3">3月 春・桜</option>
<option value="4">4月 若草</option><option value="5">5月 新緑</option><option value="6">6月 紫陽花</option>
<option value="7">7月 海</option><option value="8">8月 ひまわり</option><option value="9">9月 月見</option>
<option value="10">10月 ハロウィン・かぼちゃ</option><option value="11">11月 紅葉</option><option value="12" selected>12月 クリスマス・雪夜</option>
</select>
</label>
</div>

<div class="screens">

<!-- ========== ホーム ========== -->
<section class="shot"><h2>ホーム（みんなのボード）</h2>
<div class="phone dark" id="home">
<div style="padding:56px 16px 0;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:center">
<a class="switch rounded" href="#groups">えーえす班 <svg class="i" width="14" height="14" viewBox="0 0 24 24" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></a>
<div style="display:flex;align-items:center;gap:8px" aria-label="いま3人が編集中">
<span style="width:8px;height:8px;border-radius:50%;background:var(--main);animation:pulse 1.6s ease-in-out infinite"></span>
<span style="display:flex"><span class="av">A</span><span class="av">K</span><span class="av">S</span></span>
</div>
</div>
<div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 4px">
<span class="rounded" style="font-size:28px;font-weight:800">窓の外</span>
<span style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>12.25</span>
</div>
<div id="board" style="position:relative;height:490px;margin:0 -16px;background-image:radial-gradient(var(--soft) 1.2px,transparent 1.2px);background-size:18px 18px;overflow:hidden">
<figure class="pol" style="left:22px;top:26px;width:156px;transform:rotate(-6deg)"><div style="height:150px;background:var(--p1)"></div><figcaption class="hand">A・東京</figcaption></figure>
<figure class="pol" style="left:196px;top:44px;width:150px;transform:rotate(5deg)"><div style="height:140px;background:var(--p2)"></div><figcaption class="hand">S・Vancouver</figcaption></figure>
<figure class="pol" style="left:48px;top:236px;width:170px;transform:rotate(3deg)"><div style="height:130px;background:var(--p3)"></div><figcaption class="hand">M・東京</figcaption></figure>
<a href="#post" aria-label="Rさんの写真を待っています" style="position:absolute;left:236px;top:262px;width:116px;height:140px;border-radius:8px;border:2px dashed var(--muted);transform:rotate(-4deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted)">
<span style="width:40px;height:40px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700">R</span>
<svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></a>
<svg style="position:absolute;left:12px;top:10px;pointer-events:none" width="190" height="230" viewBox="0 0 190 230" fill="none" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M30 18c40-14 110-14 140 4M178 40c6 50 4 120-6 170" style="stroke:var(--main)"/></svg>
<span style="position:absolute;left:148px;top:8px;transform:rotate(12deg)"><svg width="48" height="48" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" style="fill:var(--main)"/></svg></span>
<span style="position:absolute;left:298px;top:196px;width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;transform:rotate(-10deg);box-shadow:0 4px 10px rgba(0,0,0,.3);color:var(--main)"><svg class="i" width="32" height="32" viewBox="0 0 24 24"><path d="M12 2v20M4.9 7l14.2 10M4.9 17 19.1 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg></span>
<span style="position:absolute;left:28px;top:380px;transform:rotate(-14deg)"><svg width="46" height="46" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.6-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.1c0 5.8-8 10.4-8 10.4z" fill="#fff" stroke-width="1.5" style="stroke:var(--main)"/></svg></span>
<span class="hand" style="position:absolute;left:154px;top:392px;padding:6px 12px;border-radius:10px;background:var(--main);color:var(--on);font-size:18px;transform:rotate(-5deg);box-shadow:0 4px 10px rgba(0,0,0,.3)">さむっ！</span>
<div class="cursor" style="left:240px;top:150px;animation:cursorK 4s ease-in-out infinite"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 3l7 17 2.5-7L20 10.5z" stroke-width="1.5" style="fill:var(--main);stroke:var(--dark)"/></svg><span style="background:var(--main);color:var(--on)">K</span></div>
<div class="cursor" style="left:98px;top:330px;animation:cursorS 5s ease-in-out infinite"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 3l7 17 2.5-7L20 10.5z" fill="#fff" stroke-width="1.5" style="stroke:var(--dark)"/></svg><span style="background:#fff;color:var(--dark)">S</span></div>
</div>
<div style="display:flex;align-items:center;gap:4px;margin:0 -4px">
<button class="ib" data-add="star" aria-label="星を貼る"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" style="fill:var(--main)"/></svg></button>
<button class="ib" data-add="heart" aria-label="ハートを貼る"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.6-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.1c0 5.8-8 10.4-8 10.4z" fill="#fff"/></svg></button>
<button class="ib" data-add="snow" aria-label="雪の結晶を貼る" style="color:var(--main)"><svg class="i" width="24" height="24" viewBox="0 0 24 24" stroke-width="2.2"><path d="M12 2v20M4.9 7l14.2 10M4.9 17 19.1 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg></button>
<button class="ib hand" data-add="text" aria-label="文字を貼る" style="color:#fff;font-size:18px">あ</button>
<span style="flex:1"></span>
<button class="ib" aria-label="ペンで描く" style="color:#fff"><svg class="i" width="22" height="22" viewBox="0 0 24 24"><path d="M4 20l4-1L19 8a2.1 2.1 0 0 0-3-3L5 16z"/></svg></button>
</div>
</div>
<div id="flakes" aria-hidden="true" style="position:absolute;inset:0;pointer-events:none"></div>
<nav>
<a class="on" href="#home" aria-label="ボード"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h3v4H8zM14 12h3v4h-3z"/></svg></a>
<a href="#map" aria-label="マップ"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></a>
<a class="cam" href="#post" aria-label="撮る"><svg class="i" width="28" height="28" viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg></a>
<a href="#calendar" aria-label="カレンダー"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></a>
</nav>
</div>
</section>

<!-- ========== 撮る ========== -->
<section class="shot"><h2>撮る（お題に参加）</h2>
<div class="phone dark" id="post" style="display:flex;flex-direction:column;padding:56px 16px 40px;gap:18px">
<div style="display:flex;justify-content:space-between;align-items:center">
<a class="ib" href="#home" aria-label="閉じる"><svg class="i" width="22" height="22" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
<span class="rounded" style="font-size:22px;font-weight:800">窓の外</span>
<button class="ib" aria-label="位置情報 オン" style="border-radius:50%;background:var(--main);color:var(--on)"><svg class="i" width="20" height="20" viewBox="0 0 24 24" stroke-width="2.2"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></button>
</div>
<div style="flex:1;border-radius:32px;background:color-mix(in srgb,var(--main) 22%,var(--dark));position:relative;display:flex;align-items:center;justify-content:center;color:var(--muted)">
<svg class="i" width="56" height="56" viewBox="0 0 24 24" stroke-width="1.5" role="img" aria-label="カメラプレビュー"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>
<div style="position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#fff"><svg class="i" width="24" height="24" viewBox="0 0 24 24" style="stroke:var(--main)"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7c-2.5 0-4-1-5.5-3L3 15a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg>手をかざす</div>
<div style="position:absolute;right:18px;top:18px;display:flex;align-items:center;gap:6px;font-size:13px;color:#fff"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>34日</div>
</div>
<div style="display:flex;justify-content:center;gap:8px" aria-label="5人中3人が投稿済み">
<span style="width:10px;height:10px;border-radius:50%;background:var(--main)"></span><span style="width:10px;height:10px;border-radius:50%;background:var(--main)"></span><span style="width:10px;height:10px;border-radius:50%;background:var(--main)"></span><span style="width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)"></span><span style="width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)"></span>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 24px">
<button class="ib" aria-label="写真を選ぶ" style="width:52px;height:52px"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
<a href="#home" aria-label="撮影して投稿" style="width:84px;height:84px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center"><span style="width:64px;height:64px;border-radius:50%;background:var(--main)"></span></a>
<button class="ib" aria-label="カメラを切り替える" style="width:52px;height:52px"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg></button>
</div>
</div>
</section>

<!-- ========== マップ ========== -->
<section class="shot"><h2>マップ（どこから投稿したか）</h2>
<div class="phone dark" id="map">
<div aria-hidden="true" style="position:absolute;inset:0;background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:16px 16px"></div>
<svg aria-hidden="true" style="position:absolute;left:0;top:0" width="390" height="844" viewBox="0 0 390 844">
<g style="fill:var(--land)">
<path d="M-20 110 C 40 120 78 170 70 230 C 64 280 40 300 46 340 C 52 380 20 420 -20 430 Z"/>
<path d="M96 262 C 110 270 116 296 110 318 C 104 340 92 352 84 366 C 78 360 86 340 90 320 C 94 298 88 276 96 262 Z"/>
<path d="M78 372 C 86 376 86 388 78 394 C 72 390 72 378 78 372 Z"/>
<path d="M410 70 C 360 90 318 140 312 200 C 306 250 330 300 340 350 C 348 400 380 430 410 440 Z"/>
<path d="M300 230 C 306 236 306 248 300 252 C 294 246 294 236 300 230 Z"/>
</g>
<path d="M100 330 C 150 200 260 170 318 240" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8" style="stroke:var(--main);animation:dash 1.6s linear infinite"/>
</svg>
<div style="position:absolute;left:0;right:0;top:56px;padding:0 16px;display:flex;justify-content:space-between;align-items:center">
<a class="switch rounded" href="#groups">えーえす班 <svg class="i" width="14" height="14" viewBox="0 0 24 24" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></a>
<button class="ib" aria-label="現在地"><svg class="i" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>
<div style="position:absolute;left:168px;top:196px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--main)"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>17h</div>
<button class="pin" data-city="tyo" aria-label="東京 2枚" style="left:62px;top:268px"><span class="ring"><span style="background:var(--p1)"></span></span><span class="tail"></span><span class="cnt">2</span></button>
<button class="pin" data-city="van" aria-label="バンクーバー 1枚" style="left:280px;top:176px"><span aria-hidden="true" style="position:absolute;left:10px;top:0;width:56px;height:56px;border-radius:50%;background:var(--main);animation:ping 2s ease-out infinite"></span><span class="ring"><span style="background:var(--p2)"></span></span><span class="tail"></span><span class="cnt">1</span></button>
<div style="position:absolute;left:0;right:0;bottom:84px;padding:22px 20px 20px;border-radius:28px 28px 0 0;background:var(--dark);box-shadow:0 -10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:16px">
<span aria-hidden="true" style="align-self:center;width:36px;height:4px;border-radius:2px;background:var(--soft);margin-top:-10px"></span>
<div style="display:flex;justify-content:space-between;align-items:center">
<span class="rounded" id="sheetCity" style="font-size:22px;font-weight:800"></span>
<span style="display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700"><span id="sheetIcon" style="display:flex"></span><span id="sheetTime"></span></span>
</div>
<div id="sheetItems" style="display:flex;gap:12px"></div>
</div>
<nav>
<a href="#home" aria-label="ボード"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h3v4H8zM14 12h3v4h-3z"/></svg></a>
<a class="on" href="#map" aria-label="マップ"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></a>
<a class="cam" href="#post" aria-label="撮る"><svg class="i" width="28" height="28" viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg></a>
<a href="#calendar" aria-label="カレンダー"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></a>
</nav>
</div>
</section>

<!-- ========== カレンダー ========== -->
<section class="shot"><h2>カレンダー（ボードを振り返る）</h2>
<div class="phone light" id="calendar">
<div style="padding:56px 20px 100px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="ib" aria-label="前の年"><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></button>
<span class="rounded" style="font-size:30px;font-weight:800">2026</span>
<button class="ib" aria-label="次の年" style="color:var(--faint)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></button>
</div>
<div id="months" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:12px;row-gap:14px"></div>
</div>
<nav>
<a href="#home" aria-label="ボード"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h3v4H8zM14 12h3v4h-3z"/></svg></a>
<a href="#map" aria-label="マップ"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></a>
<a class="cam" href="#post" aria-label="撮る"><svg class="i" width="28" height="28" viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg></a>
<a class="on" href="#calendar" aria-label="カレンダー"><svg class="i" width="26" height="26" viewBox="0 0 24 24" stroke-width="2.4"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></a>
</nav>
</div>
</section>

<!-- ========== グループ ========== -->
<section class="shot"><h2>グループ選択</h2>
<div class="phone light" id="groups">
<div style="padding:56px 20px 100px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<a class="ib" href="#home" aria-label="戻る" style="margin-left:-10px"><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></a>
<span class="rounded" style="font-size:20px;font-weight:800">グループ</span>
<button class="ib" aria-label="招待コードで参加" style="margin-right:-10px"><svg class="i" width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg></button>
</div>
<div id="groupList" style="display:flex;flex-direction:column;gap:8px"></div>
<button style="display:flex;align-items:center;gap:14px;padding:10px 0;border:none;background:transparent;color:var(--sub);font-size:15px;font-weight:700;text-align:left">
<span style="width:60px;height:60px;border-radius:16px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center"><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></span>新しいグループ</button>
</div>
</div>
</section>

</div>

<script>
(function(){
var THEMES={1:['#E0533F','#2A0F0C','#FFFFFF'],2:['#E05A8A','#2E0F1D','#FFFFFF'],3:['#EE96B0','#33161F','#33161F'],4:['#8CC63F','#18240E','#18240E'],5:['#34B57A','#0D2419','#0D2419'],6:['#7B8CE6','#151A38','#151A38'],7:['#2FAEE8','#0A2230','#0A2230'],8:['#F5BE1B','#2B2203','#2B2203'],9:['#A98BD6','#211931','#211931'],10:['#F2843A','#2C1407','#2C1407'],11:['#D2664A','#2A110B','#2A110B'],12:['#6E9BF2','#0D1A33','#0D1A33']};
var mix=function(c,p,b){return 'color-mix(in srgb,'+c+' '+p+'%,'+b+')';};
var month=12, city='van', added=[];
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

function applyTheme(){
  var t=THEMES[month], r=document.documentElement.style;
  r.setProperty('--main',t[0]); r.setProperty('--dark',t[1]); r.setProperty('--on',t[2]);
  renderFlakes(); renderMonths(); renderGroups(); renderSheet();
}
function renderFlakes(){
  var winter=month===12||month<=2, seed=7, html='';
  var rnd=function(){seed=(seed*9301+49297)%233280;return seed/233280;};
  for(var i=0;i<24;i++){
    var s=(winter?2+rnd()*5:5+rnd()*6).toFixed(1), l=(rnd()*100).toFixed(1), d=(8+rnd()*10).toFixed(1), dl=(rnd()*18).toFixed(1), o=(0.35+rnd()*0.55).toFixed(2);
    html+='<span class="flake" style="left:'+l+'%;width:'+s+'px;height:'+s+'px;border-radius:'+(winter?'50%':'60% 0 60% 0')+';background:'+(winter?'#fff':'var(--p2)')+';opacity:'+o+';animation:fall '+d+'s linear -'+dl+'s infinite"></span>';
  }
  document.getElementById('flakes').innerHTML=html;
}
var STICKER={
  star:'<svg width="44" height="44" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" stroke="#fff" stroke-width="1.2" style="fill:var(--main)"/></svg>',
  heart:'<svg width="44" height="44" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.6-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.1c0 5.8-8 10.4-8 10.4z" fill="#fff" stroke-width="1.5" style="stroke:var(--main)"/></svg>',
  snow:'<span style="width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--main)"><svg class="i" width="28" height="28" viewBox="0 0 24 24"><path d="M12 2v20M4.9 7l14.2 10M4.9 17 19.1 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg></span>',
  text:'<span class="hand" style="display:block;padding:6px 12px;border-radius:10px;background:#fff;color:var(--main);font-size:18px">わぁ！</span>'
};
document.querySelectorAll('[data-add]').forEach(function(b){
  b.addEventListener('click',function(){
    var n=added.length; added.push(1);
    var el=document.createElement('span');
    el.setAttribute('aria-hidden','true');
    el.style.cssText='position:absolute;left:'+(24+((n*97+41)%290))+'px;top:'+(30+((n*151+67)%380))+'px;rotate:'+(((n*37)%40)-20)+'deg;animation:pop .35s ease-out';
    el.innerHTML=STICKER[b.getAttribute('data-add')];
    document.getElementById('board').insertBefore(el,document.querySelector('#board .cursor'));
  });
});
function renderMonths(){
  var boards={1:{n:'新年'},2:{n:'バレンタイン',b:'A'},3:{n:'春'},5:{n:'Sの誕生日',b:'S'},10:{n:'ハロウィン'},12:{n:'クリスマス',b:'R'}};
  var page=mix(THEMES[month][0],8,'#fff'), html='';
  for(var m=1;m<=12;m++){
    var th=THEMES[m], b=boards[m], cur=m===month;
    var box='background:'+(b?th[0]:'transparent')+';'+(b?'':'border:1.5px dashed '+mix(th[0],70,'#fff')+';')+(cur?'box-shadow:0 0 0 3px '+page+',0 0 0 5px '+th[1]+';':'');
    var inner='';
    if(b){
      var pol=function(l,t,w,h,r,c){return '<span class="mini" style="left:'+l+'%;top:'+t+'px;width:'+w+'%;height:'+h+'px;transform:rotate('+r+'deg)"><span style="background:'+c+'"></span></span>';};
      inner+=pol(8,10,42,50,-8+(m%3)*3,mix(th[0],55,'#fff'))+pol(48,16,40,48,7-(m%4),mix(th[0],30,'#fff'))+pol(26,46,44,44,3,mix(th[0],75,th[1]));
      if(b.b) inner+='<span style="position:absolute;left:6px;bottom:6px;width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:'+th[1]+'">'+b.b+'</span>';
      if(cur) inner+='<span style="position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite"></span>';
    } else {
      inner+='<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:'+th[0]+'"><svg class="i" width="20" height="20" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></span>';
    }
    html+='<a href="'+(cur?'#home':'#calendar')+'" aria-label="'+m+'月 '+(b?b.n:'ボードを追加')+'" style="display:flex;flex-direction:column;gap:6px"><span class="tile" style="'+box+'">'+inner+'</span><span style="display:flex;align-items:baseline;gap:6px;padding:0 2px"><span class="rounded" style="font-size:15px;font-weight:800;color:'+(b||cur?'var(--dark)':'var(--faint)')+'">'+m+'</span><span style="font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(b?b.n:'')+'</span></span></a>';
  }
  document.getElementById('months').innerHTML=html;
}
function renderGroups(){
  var gs=[{n:'えーえす班',cur:true,u:'',m:['A','K','M','R','S']},{n:'LiT 同期',cur:false,u:'2',m:['A','T','Y']},{n:'ホストファミリー',cur:false,u:'',m:['J','L']}];
  var html='';
  gs.forEach(function(g){
    var av=g.m.map(function(x,k){return '<span style="width:22px;height:22px;border-radius:50%;background:var(--light);border:2px solid var(--page);'+(k?'margin-left:-7px;':'')+'font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">'+x+'</span>';}).join('');
    var mini=function(l,t,r,c){return '<span class="mini" style="left:'+l+'px;top:'+t+'px;width:24px;height:28px;padding:2px 2px 6px;transform:rotate('+r+'deg)"><span style="background:'+c+'"></span></span>';};
    html+='<a href="#home" style="display:flex;align-items:center;gap:14px;padding:10px 0">'+
      '<span style="position:relative;width:60px;height:60px;border-radius:16px;overflow:hidden;flex-shrink:0;background:'+(g.cur?'var(--main)':'var(--dark)')+';'+(g.cur?'box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--dark)':'')+'">'+mini(8,10,-8,'var(--p2)')+mini(28,20,6,'var(--p1)')+'</span>'+
      '<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><span class="rounded" style="font-size:17px;font-weight:700">'+esc(g.n)+'</span><span style="display:flex">'+av+'</span></span>'+
      (g.cur?'<svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="2.8" role="img" aria-label="選択中" style="stroke:var(--dark)"><path d="m5 12 5 5 9-10"/></svg>':'')+
      (g.u?'<span aria-label="新着" style="min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--main);color:var(--on);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">'+g.u+'</span>':'')+
      '</a>';
  });
  document.getElementById('groupList').innerHTML=html;
}
var MOON='<svg class="i" width="20" height="20" viewBox="0 0 24 24" style="stroke:var(--main)"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
var SUN='<svg class="i" width="20" height="20" viewBox="0 0 24 24" style="stroke:var(--main)"><path d="M3 18h18M6 14a6 6 0 0 1 12 0M12 4v3M4.9 8.9l1.4 1.4M19.1 8.9l-1.4 1.4"/></svg>';
function renderSheet(){
  var S={van:{c:'バンクーバー',t:'04:40',i:SUN,p:[['S','var(--p2)',-3],['K']]},tyo:{c:'東京',t:'21:40',i:MOON,p:[['A','var(--p1)',-4],['M','var(--p3)',3],['R']]}}[city];
  document.getElementById('sheetCity').textContent=S.c;
  document.getElementById('sheetTime').textContent=S.t;
  document.getElementById('sheetIcon').innerHTML=S.i;
  document.getElementById('sheetItems').innerHTML=S.p.map(function(p){
    return p[1]?'<figure style="margin:0;width:96px;padding:5px 5px 20px;background:#fff;border-radius:5px;position:relative;transform:rotate('+p[2]+'deg)"><span style="display:block;height:96px;border-radius:2px;background:'+p[1]+'"></span><figcaption class="hand" style="position:absolute;left:7px;bottom:2px;font-size:12px;color:var(--dark)">'+p[0]+'</figcaption></figure>'
      :'<span style="width:96px;height:121px;border-radius:6px;border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)">'+p[0]+'</span>';
  }).join('');
  document.querySelectorAll('.pin').forEach(function(b){
    var sel=b.getAttribute('data-city')===city, r=b.querySelector('.ring');
    b.setAttribute('aria-pressed',sel?'true':'false');
    r.style.width=r.style.height=(sel?60:50)+'px';
    r.style.marginTop=(sel?0:6)+'px';
    r.style.boxShadow=sel?'0 0 0 3px var(--main)':'none';
  });
}
document.querySelectorAll('.pin').forEach(function(b){b.addEventListener('click',function(){city=b.getAttribute('data-city');renderSheet();});});
document.getElementById('month').addEventListener('change',function(e){month=+e.target.value;applyTheme();});
applyTheme();
})();
</script>
</body>
</html>
